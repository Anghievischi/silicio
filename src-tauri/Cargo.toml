[package]
name = "silicio"
version = "0.1.2"
description = "Silício — informações de hardware com visual moderno"
authors = ["Studio Alpha"]
edition = "2024"
default-run = "silicio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "silicio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embute a interface compilada no executável. O `tauri dev` roda com
# --no-default-features para usar o servidor do Vite no lugar.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
nvml-wrapper = "0.13.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11.6.0"

[target."cfg(windows)".dependencies]
wmi = "0.18.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Graphics_Dxgi",
    "Win32_System_Registry",
] }

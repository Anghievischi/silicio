name: Feature request / Sugestão
description: An idea for Silício. / Uma ideia para o Silício.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do? / O que você gostaria de fazer?
      description: Describe the problem or use case before the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work? / Como poderia funcionar?
  - type: dropdown
    id: platform
    attributes:
      label: Platform / Plataforma
      multiple: true
      options:
        - Linux
        - Windows

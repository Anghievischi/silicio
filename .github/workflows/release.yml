name: Release

# Gera os instaladores de Windows e Linux e publica numa release do GitHub
# sempre que uma tag vX.Y.Z é enviada (ou manualmente pela aba Actions).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile
      # O Tauri exige a pasta do front compilado para compilar o Rust.
      - run: pnpm build

      - name: Testes do backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Silício ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            **Windows 10/11**
            - `Silicio-setup.exe` — instalador (recomendado)
            - `Silicio-portable.exe` — executável único, sem instalar
            - `Silicio.msi` — para instalação gerenciada (empresas)

            **Linux**
            - `Silicio-amd64.deb` — Debian, Ubuntu, Mint, Pop!_OS
            - `Silicio-x86_64.rpm` — Fedora, openSUSE
            - `Silicio-x86_64.AppImage` — qualquer distribuição (sem as leituras avançadas)

            Os arquivos com a versão no nome são os mesmos, gerados pelo Tauri.

            Instruções completas no [README](https://github.com/${{ github.repository }}#instalação).
          releaseDraft: false
          prerelease: false

      # Cópias com nome fixo, para os links de download do README nunca mudarem:
      # https://github.com/<repo>/releases/latest/download/<nome>
      - name: Arquivos com nome fixo (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=src-tauri/target/release/bundle
          cp src-tauri/target/release/silicio.exe Silicio-portable.exe
          cp $B/nsis/*-setup.exe Silicio-setup.exe
          cp $B/msi/*.msi Silicio.msi
          gh release upload "${{ github.ref_name }}" Silicio-portable.exe Silicio-setup.exe Silicio.msi --clobber

      - name: Arquivos com nome fixo (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=src-tauri/target/release/bundle
          cp $B/deb/*.deb Silicio-amd64.deb
          cp $B/rpm/*.rpm Silicio-x86_64.rpm
          cp $B/appimage/*.AppImage Silicio-x86_64.AppImage
          gh release upload "${{ github.ref_name }}" Silicio-amd64.deb Silicio-x86_64.rpm Silicio-x86_64.AppImage --clobber

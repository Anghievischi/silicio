name: Release

# Gera os instaladores de Windows e Linux e publica numa release do GitHub
# sempre que uma tag vX.Y.Z é enviada.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 1. Cria a release como pré-release: os links "latest" continuam na versão
  #    anterior até todos os arquivos estarem enviados.
  create:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --latest=false \
              --title "Silício $TAG" --notes-file .github/release-notes.md
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # 2. Compila, assina e envia os pacotes de cada sistema para essa release.
  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile
      # O Tauri exige a pasta do front compilado para compilar o Rust.
      - run: pnpm build

      - name: Testes do backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina os pacotes para a atualização automática (chave pública em tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Gera os arquivos .sig e o latest.json só aqui, para quem compila localmente não precisar da chave.
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
          updaterJsonPreferNsis: true
          releaseId: ${{ needs.create.outputs.id }}

      # Cópias com nome fixo, para os links de download do README nunca mudarem:
      # https://github.com/<repo>/releases/latest/download/<nome>
      - name: Arquivos com nome fixo (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=src-tauri/target/release/bundle
          cp src-tauri/target/release/silicio.exe Silicio-portable.exe
          cp $B/nsis/*-setup.exe Silicio-setup.exe
          cp $B/msi/*.msi Silicio.msi
          gh release upload "${{ github.ref_name }}" Silicio-portable.exe Silicio-setup.exe Silicio.msi --clobber

      - name: Arquivos com nome fixo (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=src-tauri/target/release/bundle
          cp $B/deb/*.deb Silicio-amd64.deb
          cp $B/rpm/*.rpm Silicio-x86_64.rpm
          cp $B/appimage/*.AppImage Silicio-x86_64.AppImage
          gh release upload "${{ github.ref_name }}" Silicio-amd64.deb Silicio-x86_64.rpm Silicio-x86_64.AppImage --clobber

  # 3. Com tudo enviado, vira a versão oficial e passa a ser a "latest".
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" -R "${{ github.repository }}" --prerelease=false --latest

name: CI

# Verifica cada push e pull request em Linux e Windows. O build dos
# instaladores fica no release.yml, disparado por tags.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # O Tauri exige a pasta do front compilado para compilar o Rust.
      - run: pnpm build

      - name: Testes
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
